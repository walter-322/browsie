name: Build Corex Office (Windows)

on:
  workflow_dispatch:   # run manually from the Actions tab
  push:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 600   # LibreOffice builds are long; adjust if needed

    steps:
      - name: Checkout Corex-Office
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GitHub's windows-2022 runners ship with WSL already available,
      # but we make sure a distro is installed and set as default.
      - name: Set up WSL (Ubuntu)
        uses: Vampire/setup-wsl@v7
        timeout-minutes: 15
        with:
          distribution: Ubuntu-22.04

      - name: Install Linux-side build helpers inside WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            git make zip unzip nasm python3 python3-pip

      # LibreOffice's Windows build expects Visual Studio 2022 with the
      # "Desktop development with C++" workload. windows-2022 runners
      # come with VS2022 Build Tools preinstalled.
      - name: Verify MSVC toolchain is present
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # autogen.sh / configure need to run from within the WSL shell in
      # "WSL as helper" mode, per LibreOffice's documented Windows build path.
      - name: Configure build
        shell: wsl-bash {0}
        env:
          WSLENV: ProgramFiles(x86)/p
        run: |
          cd $GITHUB_WORKSPACE
          ./autogen.sh --with-distro=CorexOfficeWin64

      - name: Build (this is the multi-hour step)
        shell: wsl-bash {0}
        env:
          WSLENV: ProgramFiles(x86)/p
        run: |
          cd $GITHUB_WORKSPACE
          make

      - name: Package build output as zip
        shell: pwsh
        run: |
          $outDir = "instsetoo_native"
          Compress-Archive -Path "$outDir\*" -DestinationPath "CorexOffice-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorexOffice-windows
          path: CorexOffice-windows.zip
          retention-days: 14