name: Build Browsie

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: browsie-linux
            artifact-path: obj-*/dist/*.tar.bz2
          - os: windows-latest
            artifact-name: browsie-windows
            artifact-path: obj-*/dist/**/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install MozillaBuild (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile "MozillaBuildSetup.exe"
          Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait

      - name: Cache mozbuild toolchain
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-v1

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Bootstrap build deps
        timeout-minutes: 60
        shell: bash
        run: |
          ./mach --no-interactive bootstrap --application-choice=browser 2>&1 | while IFS= read -r line; do
            echo "$line"
          done

      - name: Build
        run: ./mach build

      - name: Package
        run: ./mach package

